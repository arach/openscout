name: CI

on:
  # CI runs at checkpoints, not on every commit. Pushing a `ci-*` tag (or
  # running the workflow manually) validates whatever is on the branch at
  # that moment, so a batch of small PRs costs one run instead of one each.
  #
  # Deliberately NOT on pull_request or on push to main: a stacked series
  # produced ~3 runs per PR, most cancelling each other before finishing.
  #
  # The tradeoff is real, not cosmetic. CI catches things local runs cannot:
  # the sync-exec fence, and tests that only fail on a machine without the
  # harness CLIs installed. Nothing now blocks a merge, so a checkpoint tag
  # has to be pushed before trusting a batch.
  push:
    tags:
      - "ci-*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync exec fence
        run: bun run sync-exec:fence

      - name: Typecheck
        run: |
          bun run --cwd packages/protocol check
          bun run --cwd packages/agent-sessions check
          bun run --cwd packages/runtime check
          bun run --cwd packages/session-trace check
          bun run --cwd packages/session-trace-react check
          bun run --cwd apps/desktop check
          bun run --cwd apps/cloud check
          bun run --cwd apps/mesh-front-door check

      - name: Unit tests
        env:
          OPENSCOUT_CONFORMANCE: "1"
        run: |
          if bun -e "const pkg = require('./package.json'); process.exit(pkg.scripts?.['test:unit'] ? 0 : 1)"; then
            bun run test:unit
          else
            bun run --cwd packages/protocol test
            bun run --cwd packages/agent-sessions test
            bun test ./packages/runtime/src/**/*.test.ts --path-ignore-patterns='**/*live.test.ts' --path-ignore-patterns='**/scenario-suite.test.ts'
            bun run --cwd apps/mesh-front-door test
            bun run --cwd apps/desktop test:happy
            bun run --cwd packages/web test:happy
            bun test packages/session-trace/src/*.test.ts packages/session-trace-react/src/*.test.tsx
          fi

  rust-scoutd:
    name: scoutd verification
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify
        run: bash scripts/scoutd-verify.sh
